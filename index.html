<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ranking Capivara Clube</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .dashboard-container { width: 100%; max-width: 650px; background-color: #1e1e1e; padding: 15px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
        h1 { font-size: 1.8em; color: #4CAF50; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        /* RECORDES GERAIS */
        .live-section { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .king-box { grid-column: span 2; background: linear-gradient(145deg, #2a2a2a, #1a1a1a); border: 2px solid #FFC107; padding: 12px; border-radius: 15px; text-align: center; }
        .record-box { background-color: #252525; border: 1px solid #333; padding: 10px; border-radius: 12px; text-align: center; }
        .king-display { font-size: 2.2em; font-weight: bold; color: #FFC107; font-family: monospace; }
        .record-display { font-size: 1.2em; font-weight: bold; color: #FFC107; font-family: monospace; }
        .driver-info { font-size: 0.75em; color: #4CAF50; font-weight: bold; text-transform: uppercase; }

        /* FILTRO */
        .category-filter { margin-bottom: 15px; }
        .category-filter select { background-color: #333; color: white; padding: 12px; border-radius: 10px; border: 1px solid #4CAF50; width: 100%; font-size: 14px; font-weight: bold; outline: none; }

        /* TABELA RANKING */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background-color: #2a2a2a; color: #4CAF50; padding: 8px 4px; font-size: 0.65em; text-transform: uppercase; text-align: center; }
        td { padding: 12px 2px; border-bottom: 1px solid #333; font-size: 0.9em; text-align: center; vertical-align: middle; }
        
        .nome-cell { text-align: left; font-weight: bold; padding-left: 10px; width: 35%; line-height: 1.2; }
        .time-cell { font-family: monospace; font-weight: bold; width: 20%; }
        .p1-color { color: #4dabf7; }
        .p2-color { color: #be4bdb; }
        .soma-color { color: #4CAF50; width: 25%; }
        .cat-tag { font-size: 0.7em; color: #777; font-weight: normal; display: block; }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background-color: #1e1e1e; margin: 5% auto; padding: 25px; border: 1px solid #4CAF50; width: 95%; max-width: 450px; border-radius: 20px; position: relative; max-height: 85vh; overflow-y: auto; }
        .close-btn { position: absolute; right: 20px; top: 10px; color: #ff5722; font-size: 30px; cursor: pointer; }

        /* DESTAQUES INDIVIDUAIS NA MODAL */
        .personal-best-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .pb-card { background: #252525; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #333; }
        .pb-card small { font-size: 0.6em; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .pb-card div { font-family: monospace; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Capivara Clube</h1>
        </header>

        <div class="live-section">
            <div class="king-box">
                <div style="font-size: 0.6em; color: #FFC107;">👑 REI DA PISTA (MENOR VOLTA ÚNICA)</div>
                <div id="king-time" class="king-display">0.000s</div>
                <div id="king-name" class="driver-info">-</div>
            </div>
            <div class="record-box">
                <div style="font-size: 0.6em; color: #888;">REC P1</div>
                <div id="rec-p1-time" class="record-display">0.000s</div>
                <div id="rec-p1-name" class="driver-info">-</div>
            </div>
            <div class="record-box">
                <div style="font-size: 0.6em; color: #888;">REC P2</div>
                <div id="rec-p2-time" class="record-display">0.000s</div>
                <div id="rec-p2-name" class="driver-info">-</div>
            </div>
        </div>

        <div class="category-filter">
            <select id="categoria" onchange="renderizarTudo()">
                <option value="TODOS">GERAL (TODAS CATEGORIAS)</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 35%; text-align: left; padding-left: 10px;">PILOTO</th>
                    <th style="width: 20%;">PISTA 1</th>
                    <th style="width: 20%;">PISTA 2</th>
                    <th style="width: 25%;">SOMA</th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div id="driverModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <h2 id="modal-nome" style="color: #FFC107; text-align: center; margin-bottom: 5px; font-size: 1.5em;">-</h2>
            <p id="modal-cat" style="text-align: center; color: #4CAF50; font-size: 0.8em; margin-bottom: 20px;"></p>
            
            <div class="personal-best-grid">
                <div class="pb-card" style="border-bottom: 3px solid #4dabf7;">
                    <small>Melhor Pista 1</small>
                    <div id="pb-p1" class="p1-color">---</div>
                </div>
                <div class="pb-card" style="border-bottom: 3px solid #be4bdb;">
                    <small>Melhor Pista 2</small>
                    <div id="pb-p2" class="p2-color">---</div>
                </div>
            </div>

            <table style="width: 100%;">
                <thead>
                    <tr>
                        <th style="width: 20%;">VOLTA</th>
                        <th style="color:#4dabf7">PISTA 1</th>
                        <th style="color:#be4bdb">PISTA 2</th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const googleScriptURL = "https://script.google.com/macros/s/AKfycbx6BbQbgdffb_sVon5PSu6M1EK-2_qN2aNbLbzAat_Vx8Kuvv-mVckZI9Kp7Cdd08E/exec";
        let dadosOriginais = [];
        let rankingCalculado = [];
        let pilotosDB = {}; // Armazenar os melhores tempos para fácil acesso na modal

        async function carregar() {
            try {
                const r = await fetch(googleScriptURL + "?t=" + Date.now());
                const data = await r.json();
                if (JSON.stringify(data) !== JSON.stringify(dadosOriginais)) {
                    dadosOriginais = data;
                    processarDados();
                }
            } catch (e) { console.error("Erro na carga"); }
        }

        function processarDados() {
            pilotosDB = {};
            let absoluteKing = { tempo: Infinity, n: '-' };
            let rP1 = { t: Infinity, n: '-' }, rP2 = { t: Infinity, n: '-' };

            dadosOriginais.forEach(linha => {
                if(linha.nome_p1) {
                    if(!pilotosDB[linha.nome_p1]) pilotosDB[linha.nome_p1] = { nome: linha.nome_p1, cat: linha.categoria_p1, mP1: Infinity, mP2: Infinity };
                    let t = parseFloat(linha.tempo_p1) || 0;
                    if(t > 0) {
                        if(t < pilotosDB[linha.nome_p1].mP1) pilotosDB[linha.nome_p1].mP1 = t;
                        if(t < rP1.t) rP1 = { t: t, n: linha.nome_p1 };
                        if(t < absoluteKing.tempo) absoluteKing = { tempo: t, n: linha.nome_p1 };
                    }
                }
                if(linha.nome_p2) {
                    if(!pilotosDB[linha.nome_p2]) pilotosDB[linha.nome_p2] = { nome: linha.nome_p2, cat: linha.categoria_p2, mP1: Infinity, mP2: Infinity };
                    let t = parseFloat(linha.tempo_p2) || 0;
                    if(t > 0) {
                        if(t < pilotosDB[linha.nome_p2].mP2) pilotosDB[linha.nome_p2].mP2 = t;
                        if(t < rP2.t) rP2 = { t: t, n: linha.nome_p2 };
                        if(t < absoluteKing.tempo) absoluteKing = { tempo: t, n: linha.nome_p2 };
                    }
                }
            });

            rankingCalculado = Object.values(pilotosDB).map(p => {
                const completo = (p.mP1 !== Infinity && p.mP2 !== Infinity);
                const soma = completo ? (p.mP1 + p.mP2) : Infinity;
                return { ...p, soma: soma, completo: completo };
            }).sort((a, b) => a.soma - b.soma);

            document.getElementById('king-time').textContent = absoluteKing.tempo !== Infinity ? absoluteKing.tempo.toFixed(3) + "s" : "---";
            document.getElementById('king-name').textContent = absoluteKing.n;
            document.getElementById('rec-p1-time').textContent = rP1.t !== Infinity ? rP1.t.toFixed(3) + "s" : "---";
            document.getElementById('rec-p1-name').textContent = rP1.n;
            document.getElementById('rec-p2-time').textContent = rP2.t !== Infinity ? rP2.t.toFixed(3) + "s" : "---";
            document.getElementById('rec-p2-name').textContent = rP2.n;

            const catSel = document.getElementById('categoria');
            if (catSel.options.length <= 1) {
                const cats = [...new Set(rankingCalculado.map(p => p.cat))].sort();
                cats.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.textContent = c.toUpperCase();
                    catSel.appendChild(opt);
                });
            }
            renderizarTudo();
        }

        function renderizarTudo() {
            const body = document.getElementById('ranking-body');
            const filtro = document.getElementById('categoria').value;
            body.innerHTML = '';
            const lista = (filtro === 'TODOS') ? rankingCalculado : rankingCalculado.filter(p => p.cat === filtro);

            lista.forEach((p, i) => {
                const row = document.createElement('tr');
                row.onclick = () => abrirExtrato(p.nome, p.cat);
                const t1 = p.mP1 !== Infinity ? p.mP1.toFixed(3) : '--';
                const t2 = p.mP2 !== Infinity ? p.mP2.toFixed(3) : '--';
                const soma = p.completo ? p.soma.toFixed(3) : 'PENDENTE';

                row.innerHTML = `
                    <td class="nome-cell">
                        <span style="color:#4CAF50">${i+1}º</span> ${p.nome}
                        <span class="cat-tag">${p.cat}</span>
                    </td>
                    <td class="time-cell p1-color">${t1}</td>
                    <td class="time-cell p2-color">${t2}</td>
                    <td class="time-cell soma-color">${soma}</td>
                `;
                body.appendChild(row);
            });
        }

        function abrirExtrato(nome, cat) {
            const p = pilotosDB[nome];
            document.getElementById('modal-nome').textContent = nome;
            document.getElementById('modal-cat').textContent = cat;
            
            // ATUALIZA OS MELHORES VALORES NA MODAL
            document.getElementById('pb-p1').textContent = p.mP1 !== Infinity ? p.mP1.toFixed(3) + "s" : "---";
            document.getElementById('pb-p2').textContent = p.mP2 !== Infinity ? p.mP2.toFixed(3) + "s" : "---";

            const hBody = document.getElementById('history-body');
            hBody.innerHTML = '';

            let v1 = dadosOriginais.filter(l => l.nome_p1 === nome && parseFloat(l.tempo_p1) > 0).map(l => parseFloat(l.tempo_p1));
            let v2 = dadosOriginais.filter(l => l.nome_p2 === nome && parseFloat(l.tempo_p2) > 0).map(l => parseFloat(l.tempo_p2));
            
            let max = Math.max(v1.length, v2.length);

            for (let i = 0; i < max; i++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:#888;">#${i+1}</td>
                    <td class="time-cell p1-color">${v1[i] ? v1[i].toFixed(3) + "s" : "---"}</td>
                    <td class="time-cell p2-color">${v2[i] ? v2[i].toFixed(3) + "s" : "---"}</td>
                `;
                hBody.appendChild(tr);
            }
            document.getElementById('driverModal').style.display = "block";
        }

        function fecharModal() { document.getElementById('driverModal').style.display = "none"; }
        window.onclick = e => { if(e.target == document.getElementById('driverModal')) fecharModal(); }

        carregar();
        setInterval(carregar, 3000);
    </script>
</body>
</html>
